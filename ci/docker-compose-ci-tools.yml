# =============================================================================
# Outils CI/CD — Jenkins (custom) + SonarQube + PostgreSQL + HashiCorp Vault
#
# Démarrage (1ère fois — build de l'image Jenkins) :
#   docker compose -f ci/docker-compose-ci-tools.yml up -d --build
#
# Démarrages suivants (image déjà buildée) :
#   docker compose -f ci/docker-compose-ci-tools.yml up -d
#
# Arrêt (conserve les données) :
#   docker compose -f ci/docker-compose-ci-tools.yml stop
#
# Nettoyage complet (supprime toutes les données) :
#   docker compose -f ci/docker-compose-ci-tools.yml down -v
#
# Accès :
#   Jenkins   → http://localhost:9090   admin / admin123
#   SonarQube → http://localhost:9000   admin / admin
#   Vault     → http://localhost:8200   token : root (mode dev — démo uniquement)
#
# Secrets du pipeline : copier ci/vault/secrets.env.example en ci/vault/secrets.env
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Jenkins — image custom (version fixée + plugins + Trivy + Maven pré-installés)
  # ---------------------------------------------------------------------------
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: xdshoot/poc-keycloak-jenkins:2.528.3
    container_name: jenkins
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Accès Docker depuis Jenkins
      - maven_cache:/root/.m2                        # Cache Maven inter-builds
      - vault_approle:/var/jenkins_vault:ro          # role_id / secret_id AppRole
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - VAULT_ADDR=http://vault:8200
    depends_on:
      vault:
        condition: service_healthy   # attend que l'AppRole Jenkins soit recréé dans Vault
    networks: [ci-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # SonarQube Community Edition 10.5
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:10.5-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks: [ci-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — base de données SonarQube
  # ---------------------------------------------------------------------------
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    networks: [ci-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # HashiCorp Vault — mode dev (stockage en mémoire, déjà "unsealed")
  # ⚠ Ne jamais utiliser le mode dev en production.
  #
  # Le mode dev perd tout à chaque redémarrage : start.sh rejoue donc init.sh
  # (AppRole Jenkins + policy + secrets) à chaque démarrage du conteneur.
  # Le healthcheck ne passe "healthy" qu'une fois l'AppRole recréé.
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    user: root                                          # init.sh écrit role_id / secret_id dans le volume vault_approle
    entrypoint: ["/bin/sh", "/vault/config/start.sh"]  # démarre Vault puis rejoue init.sh
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200   # pour la CLI : docker exec vault vault ...
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root}   # utilisé par init.sh et par le healthcheck
    env_file:
      - path: ./vault/secrets.env              # vraies valeurs des secrets (ignoré par git)
        required: false
    volumes:
      - ./vault/start.sh:/vault/config/start.sh:ro
      - ./vault/init.sh:/vault/config/init.sh:ro
      - ./vault/jenkins-policy.hcl:/vault/config/jenkins-policy.hcl:ro
      - vault_approle:/vault/approle             # partagé avec Jenkins (lecture seule côté Jenkins)
    cap_add:
      - IPC_LOCK
    networks: [ci-net]
    restart: unless-stopped
    healthcheck:
      # "healthy" seulement quand init.sh a recréé l'AppRole (pas juste Vault démarré)
      test: ["CMD-SHELL", "vault read auth/approle/role/jenkins-ci >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

# =============================================================================
# Réseaux & Volumes
# =============================================================================
networks:
  ci-net:
    driver: bridge

volumes:
  jenkins_home:
  maven_cache:       # Cache .m2 partagé entre tous les builds
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_pgdata:
  vault_approle:     # role_id / secret_id AppRole partagés vault → Jenkins